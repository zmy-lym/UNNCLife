name: Deploy to GitHub Pages

# When to run this recipe:
# - every push to the main branch (the normal case)
# - manually, from the "Actions" tab (for testing)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy step needs (required since 2023)
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel older queued ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out your code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Flip the Pages switch automatically so no manual web setup is needed
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
